name: Docs

# One documentation build for both PR warning gates and main Pages deploy.
# Avoids a second full WinCC OA / Doxygen run (image pull + CPU).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WINCCOA_VERSION: '3.21'
  PROJECT_PATH: src/Squirt
  WINCCOA_IMAGE: ghcr.io/winccoa-tools-pack/winccoa:v3.21.3-debian12-all
  # Fail PRs on any Doxygen warning; main/publish keeps previous soft gate.
  MAX_WARNING_COUNT: ${{ github.event_name == 'pull_request' && '0' || '-1' }}

jobs:
  build-help:
    name: Build help
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Pull WinCC OA image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${WINCCOA_IMAGE}"

      - name: Build Squirt help
        id: docs
        uses: winccoa-tools-pack/github-actions-winccoa/actions/winccoa-docu-builder@main
        with:
          path: ${{ env.PROJECT_PATH }}
          winccoa-version: ${{ env.WINCCOA_VERSION }}
          docker-image: ${{ env.WINCCOA_IMAGE }}
          company-name: winccoa-tools-pack
          languages: |
            en_US.utf8
          theme-repository: winccoa-tools-pack/docu-builder-theme
          theme-ref: main
          project-docu-paths: |
            .winccoa-docu-builder
          register-project: 'true'
          package-version: '0.2.1'
          log-path: .artifacts/docu-builder.log
          warning-output-file: .artifacts/documentation-warnings.txt
          annotate-warnings: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          max-warning-count: ${{ env.MAX_WARNING_COUNT }}
          max-annotations: '200'
          fail-on-error: 'true'

      - name: Write warning summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WARNING_COUNT="${{ steps.docs.outputs.warning-count }}"
          WARNING_FILE="${{ steps.docs.outputs.warning-file }}"
          LOG_PATH="${{ steps.docs.outputs.log-path }}"
          MAX_WARNING_COUNT="${{ env.MAX_WARNING_COUNT }}"
          TOP_WARNING_LINES=20

          {
            echo "## Documentation warning report"
            echo
            echo "- Event: ${{ github.event_name }}"
            echo "- Warning count: ${WARNING_COUNT}"
            echo "- Max warning count: ${MAX_WARNING_COUNT} (-1 means disabled)"
            echo "- Warning file: ${WARNING_FILE}"
            echo "- Docs log: ${LOG_PATH}"
            echo
            echo "Use the job log groups for stderr/stdout/WARN_LOGFILE previews and the uploaded artifacts for raw files, HTML preview, and configuration/log debug files."
            echo
            echo "External projectDocu sources: shared theme \`winccoa-tools-pack/docu-builder-theme\` (checked out to \`.docu-builder-theme\`) + \`.winccoa-docu-builder\` (merged into \`src/Squirt/data/projectDocu\` at build time)."
            echo
            echo "### Top ${TOP_WARNING_LINES} warnings"
            echo
            if [ -n "${WARNING_FILE}" ] && [ -f "${WARNING_FILE}" ] && [ -s "${WARNING_FILE}" ]; then
              head -n "${TOP_WARNING_LINES}" "${WARNING_FILE}"
            else
              echo "No warning file was produced."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload warning artifacts
        id: upload_warning_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-warning-report
          path: |
            ${{ steps.docs.outputs.warning-file }}
            ${{ steps.docs.outputs.log-path }}
            .artifacts/documentation-warnings.txt
            .artifacts/docu-builder.log
            .artifacts/*.txt
            src/Squirt/log/*.txt
            src/Squirt/data/projectDocu/*.txt
            .winccoa-docu-builder/*.txt
          if-no-files-found: warn

      - name: Upload docs preview artifact
        id: upload_docs_preview_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html-preview
          path: ${{ env.PROJECT_PATH }}/help/html
          if-no-files-found: warn

      - name: Comment warning count on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          WARNING_COUNT: ${{ steps.docs.outputs.warning-count }}
          MAX_WARNING_COUNT: ${{ env.MAX_WARNING_COUNT }}
          WARNING_FILE: ${{ steps.docs.outputs.warning-file }}
          LOG_PATH: ${{ steps.docs.outputs.log-path }}
          WARNING_ARTIFACT_ID: ${{ steps.upload_warning_artifact.outputs.artifact-id }}
          DOCS_PREVIEW_ARTIFACT_ID: ${{ steps.upload_docs_preview_artifact.outputs.artifact-id }}
        with:
          script: |
            const marker = '<!-- documentation-warning-report -->';
            const warningCount = process.env.WARNING_COUNT || 'unknown';
            const maxWarningCount = process.env.MAX_WARNING_COUNT || 'unknown';
            const warningFile = process.env.WARNING_FILE || '';
            const logPath = process.env.LOG_PATH || '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const warningArtifactId = process.env.WARNING_ARTIFACT_ID || '';
            const docsPreviewArtifactId = process.env.DOCS_PREVIEW_ARTIFACT_ID || '';

            const warningArtifactUrl = warningArtifactId
              ? `${runUrl}/artifacts/${warningArtifactId}`
              : `${runUrl}#artifacts`;
            const docsPreviewArtifactUrl = docsPreviewArtifactId
              ? `${runUrl}/artifacts/${docsPreviewArtifactId}`
              : `${runUrl}#artifacts`;

            const code = (value) => '`' + value + '`';
            const body = [
              marker,
              '## Documentation warning report',
              '',
              `- Warning count: ${warningCount}`,
              `- Max warning count: ${maxWarningCount} (-1 means disabled)`,
              `- Warning file: ${code(warningFile)}`,
              `- Docs log: ${code(logPath)}`,
              '- projectDocu sources: ' +
                code('winccoa-tools-pack/docu-builder-theme') +
                ' -> ' +
                code('.docu-builder-theme') +
                ', ' +
                code('.winccoa-docu-builder'),
              '- Configuration and log debug files are included in the warning artifact',
              `- Docs preview artifact: ${docsPreviewArtifactUrl}`,
              `- Warning report artifact: ${warningArtifactUrl}`,
              `- Run logs/artifacts: ${runUrl}`,
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/${{ env.PROJECT_PATH }}/help/html

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-help
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
