name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  WINCCOA_ROOT: /opt/WinCC_OA/3.21
  PROJECT_NAME: Squirt
  PROJECT_PATH: src/Squirt

jobs:
  build-help:
    name: Build help
    runs-on: ubuntu-latest
    env:
      WINCCOA_IMAGE: ghcr.io/winccoa-tools-pack/winccoa:latest
      WORKDIR: /workdir
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        shell: bash
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login ghcr.io \
            -u "${DOCKER_USER}" --password-stdin

      - name: Pull WinCC OA image
        run: docker pull "${WINCCOA_IMAGE}"

      - name: Start WinCC OA container
        shell: bash
        run: |
          docker run -d --name winccoa-docs \
            --user root \
            -v "${GITHUB_WORKSPACE}":"${WORKDIR}":rw \
            "${WINCCOA_IMAGE}" \
            tail -f /dev/null

      - name: Install doxygen
        run: |
          docker exec winccoa-docs bash -c '
            apt-get update -qq
            apt-get --assume-yes install -f doxygen
          '

      - name: Register Squirt project
        shell: bash
        run: |
          docker exec winccoa-docs bash -c "
            project_dir=\"${WORKDIR}/${PROJECT_PATH}\"
            mkdir -p \"\${project_dir}/config\"
            mkdir -p \"\${project_dir}/log\"
            cat > \"\${project_dir}/config/config\" <<EOF
          [general]
          pvss_path = \"${WINCCOA_ROOT}\"
          proj_path = \"\${project_dir}\"
          proj_version = \"3.21\"
          langs = \"en_US.utf8\"
          pmonPort = 5999
          EOF
            ${WINCCOA_ROOT}/bin/WCCILpmon \
              -config \"\${project_dir}/config/config\" \
              -n -autofreg -status -log +stderr || true
          "

      - name: Generate help
        run: |
          docker exec winccoa-docs bash -c "
            ${WINCCOA_ROOT}/bin/WCCOActrl \
              -proj ${PROJECT_NAME} \
              -n doxygen.ctl \
              -log +stderr \
              -lang en_US.utf8
          "

      - name: Stop container
        if: always()
        run: docker rm -f winccoa-docs || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/${{ env.PROJECT_PATH }}/help/html

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-help
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
