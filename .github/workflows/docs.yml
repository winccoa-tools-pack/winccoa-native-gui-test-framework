name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  WINCCOA_VERSION: 3.21
  PROJECT_PATH: src/Squirt

jobs:
  build-help:
    name: Build help
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve WinCC OA image
        id: image
        shell: bash
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
        run: |
          set -euo pipefail
          default_image="ghcr.io/winccoa-tools-pack/winccoa:v3.21.3-debian12-all"

          if [ -n "${DOCKER_IMAGE:-}" ]; then
            image="${DOCKER_IMAGE}"

            # If secret has no explicit tag or digest, avoid implicit :latest.
            if [[ "$image" != *@* ]]; then
              last_segment="${image##*/}"
              if [[ "$last_segment" != *:* ]]; then
                image="${image}:v3.21.3-debian12-all"
              fi
            fi

            echo "value=${image}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${default_image}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        # Required if your WinCC OA image is private.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Pull WinCC OA image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${{ steps.image.outputs.value }}"

      - name: Build Squirt help
        uses: ./.github/actions/winccoa-build-docs
        with:
          path: ${{ env.PROJECT_PATH }}
          winccoa-version: ${{ env.WINCCOA_VERSION }}
          docker-image: ${{ steps.image.outputs.value }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/${{ env.PROJECT_PATH }}/help/html

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-help
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
