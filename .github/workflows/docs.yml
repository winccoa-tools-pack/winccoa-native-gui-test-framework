name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  WINCCOA_VERSION: 3.21
  PROJECT_NAME: Squirt
  PROJECT_PATH: src/Squirt

jobs:
  build-help:
    name: Build help
    runs-on: ubuntu-latest
    env:
      WINCCOA_IMAGE: ghcr.io/winccoa-tools-pack/winccoa:v3.21.3-debian12-all
      WORKDIR: /workspace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull WinCC OA image
        run: docker pull "${WINCCOA_IMAGE}"

      - name: Build Squirt help in container
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_SCRIPT=$(cat <<'BASH'
          set -euo pipefail

          OA_PATH="/opt/WinCC_OA/${WINCCOA_VERSION}"
          PROJ_PATH="${WORKDIR}/${PROJECT_PATH}"
          CONFIG_TMP="/tmp/squirt-docs.config"
          CREATE_DB_BIN="$OA_PATH/bin/WCCOAtoolCreateDbSQLite"

          mkdir -p "$PROJ_PATH/log"
          mkdir -p "$PROJ_PATH/help"

          cat > "$CONFIG_TMP" <<EOF
          [general]
          pvss_path = "$OA_PATH"
          proj_path = "$PROJ_PATH"
          proj_version = "${WINCCOA_VERSION}"
          langs = "en_US.utf8"
          pmonPort = 5999
          EOF

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get --assume-yes install -f doxygen
          else
            echo "::warning::apt-get not available in image; assuming doxygen is preinstalled"
          fi

          if [ -x "$CREATE_DB_BIN" ]; then
            "$CREATE_DB_BIN" -config "$CONFIG_TMP" -empty -yes
          else
            echo "::warning::WCCOAtoolCreateDbSQLite not found at $CREATE_DB_BIN; skipping DB creation"
          fi

          "$OA_PATH/bin/WCCILpmon" \
            -config "$CONFIG_TMP" \
            -n -autofreg -status -log +stderr || true

          "$OA_PATH/bin/WCCOActrl" \
            -config "$CONFIG_TMP" \
            -n doxygen.ctl \
            -log +stderr \
            -lang en_US.utf8
          BASH
          )

          docker run --rm \
            --user root \
            --shm-size=2g \
            -v "${GITHUB_WORKSPACE}":"${WORKDIR}":rw \
            -w "${WORKDIR}" \
            -e WINCCOA_VERSION="${WINCCOA_VERSION}" \
            -e PROJECT_PATH="${PROJECT_PATH}" \
            -e WORKDIR="${WORKDIR}" \
            "${WINCCOA_IMAGE}" \
            bash -lc "$CONTAINER_SCRIPT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/${{ env.PROJECT_PATH }}/help/html

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-help
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
