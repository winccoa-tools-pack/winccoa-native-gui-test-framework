name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  checks: write
  pull-requests: write

env:
  WINCCOA_VERSION: 3.21
  PROJECT_PATH: src/Squirt
  TEST_PROJECT_PATH: tests/WinCC_OA_Test
  WINCCOA_IMAGE: ghcr.io/winccoa-tools-pack/winccoa:v3.21.3-debian12-all
  LANGUAGES: en_US.utf8 de_AT.utf8

jobs:
  test-squirt:
    name: WinCC OA TestFramework - Squirt Tests
    runs-on: ubuntu-latest
    container:
      image: ${{ env.WINCCOA_IMAGE }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create project config
        id: config
        uses: winccoa-tools-pack/github-actions-winccoa/actions/winccoa-create-project-config@feature/add-winccoa-test-actions
        with:
          project-path: ${{ env.PROJECT_PATH }}
          languages: ${{ env.LANGUAGES }}
          winccoa-version: ${{ env.WINCCOA_VERSION }}

      - name: Run WinCC OA tests
        id: tests
        uses: winccoa-tools-pack/github-actions-winccoa/actions/winccoa-run-tests@feature/add-winccoa-test-actions
        with:
          project-path: ${{ env.PROJECT_PATH }}
          test-project-path: ${{ env.TEST_PROJECT_PATH }}
          test-run-id: Squirt-regression
          languages: ${{ env.LANGUAGES }}
          winccoa-version: ${{ env.WINCCOA_VERSION }}
