name: Yearly Copyright Update

on:
  schedule:
    # 04:00 UTC on 1 January
    - cron: "0 4 1 1 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  yearly-update:
    name: Bump copyright year
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Marketplace: https://github.com/marketplace/actions/update-copyright-year
      # https://github.com/octivi/update-copyright-year
      - name: Update copyright years in headers
        uses: octivi/update-copyright-year@v1
        with:
          targets: |
            .
            src/Squirt
            tests/WinCC_OA_Test
          exclude_paths: |
            .github/workflows
            node_modules
            help
            log
          include_glob: |
            **/*.ctl
            LICENSE
          organization_regexp: "winccoa-tools-pack"
          verbose: "true"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/yearly-copyright-update
          delete-branch: true
          title: "chore: bump copyright year"
          commit-message: "chore: bump copyright year"
          body: |
            ## Summary
            - bump copyright years in CTL headers (and LICENSE when present)
            - automated via [octivi/update-copyright-year](https://github.com/marketplace/actions/update-copyright-year)

            ## Validation
            - review the diff
            - existing `ctrl-copyright-check` still enforces owner/SPDX on PRs
          labels: |
            dependencies
            area/build
