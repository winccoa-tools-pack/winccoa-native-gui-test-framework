name: Doxygen Warning Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  warning-report:
    name: Doxygen Warning Report
    runs-on: ubuntu-latest
    env:
      WINCCOA_VERSION: 3.21
      WINCCOA_IMAGE: ghcr.io/winccoa-tools-pack/winccoa:v3.21.3-debian12-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        # Required if your WinCC OA image is private.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Pull WinCC OA image
        run: docker pull "$WINCCOA_IMAGE"

      - name: Build docs
        id: docs
        uses: ./.github/actions/winccoa-build-docs
        with:
          path: src/Squirt
          winccoa-version: ${{ env.WINCCOA_VERSION }}
          docker-image: ${{ env.WINCCOA_IMAGE }}
          warning-output-file: .artifacts/doxygen-warnings.txt

      - name: Write warning summary
        shell: bash
        run: |
          set -euo pipefail
          WARNING_COUNT="${{ steps.docs.outputs.warning-count }}"
          WARNING_FILE="${{ steps.docs.outputs.warning-file }}"

          {
            echo "## Doxygen warning report"
            echo
            echo "- Warning count: ${WARNING_COUNT}"
            echo "- Warning file: ${WARNING_FILE}"
            echo
            echo "Use the job log groups for stderr/stdout previews and the uploaded artifact for raw files."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment warning count on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- doxygen-warning-report -->';
            const warningCount = `${{ steps.docs.outputs.warning-count }}`;
            const warningFile = `${{ steps.docs.outputs.warning-file }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '## Doxygen warning report',
              '',
              `- Warning count: ${warningCount}`,
              `- Warning file: ${warningFile}`,
              `- Run logs/artifacts: ${runUrl}`
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Upload warning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-warning-report
          path: |
            ${{ steps.docs.outputs.warning-file }}
            src/Squirt/log/doxygen_stdErr.txt
            src/Squirt/log/doxygen_stdOut.txt
