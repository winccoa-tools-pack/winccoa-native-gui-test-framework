name: Doxygen Warning Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  warning-report:
    name: Doxygen Warning Report
    runs-on: ubuntu-latest
    env:
      WINCCOA_VERSION: '3.21'
      WINCCOA_IMAGE: ghcr.io/winccoa-tools-pack/winccoa:v3.21.3-debian12-all
      PROJECT_PATH: src/Squirt
      MAX_WARNING_COUNT: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        # Required if your WinCC OA image is private.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Pull WinCC OA image
        run: docker pull "$WINCCOA_IMAGE"

      - name: Build docs
        id: docs
        uses: winccoa-tools-pack/github-actions-winccoa/actions/winccoa-docu-builder@main
        with:
          path: ${{ env.PROJECT_PATH }}
          winccoa-version: ${{ env.WINCCOA_VERSION }}
          docker-image: ${{ env.WINCCOA_IMAGE }}
          company-name: winccoa-tools-pack
          languages: |
            en_US.utf8
          register-project: 'true'
          package-version: '0.1.0'
          warning-output-file: .artifacts/doxygen-warnings.txt
          log-path: .artifacts/docu-builder.log
          annotate-warnings: 'true'
          max-warning-count: ${{ env.MAX_WARNING_COUNT }}
          max-annotations: '200'
          install-doxygen: 'true'
          fail-on-error: 'true'

      - name: Write warning summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WARNING_COUNT="${{ steps.docs.outputs.warning-count }}"
          WARNING_FILE="${{ steps.docs.outputs.warning-file }}"
          LOG_PATH="${{ steps.docs.outputs.log-path }}"
          MAX_WARNING_COUNT="${{ env.MAX_WARNING_COUNT }}"

          {
            echo "## Doxygen warning report"
            echo
            echo "- Warning count: ${WARNING_COUNT}"
            echo "- Max warning count: ${MAX_WARNING_COUNT} (-1 means disabled)"
            echo "- Warning file: ${WARNING_FILE}"
            echo "- Docs log: ${LOG_PATH}"
            echo
            echo "Use the job log groups for stderr/stdout previews and the uploaded artifacts for raw files and HTML preview."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload warning artifacts
        id: upload_warning_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-warning-report
          path: |
            ${{ steps.docs.outputs.warning-file }}
            ${{ steps.docs.outputs.log-path }}
            .artifacts/doxygen-warnings.txt
            .artifacts/docu-builder.log
            src/Squirt/log/doxygen_stdErr.txt
            src/Squirt/log/doxygen_stdOut.txt
          if-no-files-found: warn

      - name: Upload docs preview artifact
        id: upload_docs_preview_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html-preview
          path: src/Squirt/help/html
          if-no-files-found: warn

      - name: Comment warning count on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- doxygen-warning-report -->';
            const warningCount = `${{ steps.docs.outputs.warning-count }}`;
            const maxWarningCount = `${{ env.MAX_WARNING_COUNT }}`;
            const warningFile = `${{ steps.docs.outputs.warning-file }}`;
            const logPath = `${{ steps.docs.outputs.log-path }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const warningArtifactId = `${{ steps.upload_warning_artifact.outputs.artifact-id }}`;
            const docsPreviewArtifactId = `${{ steps.upload_docs_preview_artifact.outputs.artifact-id }}`;

            const warningArtifactUrl = warningArtifactId
              ? `${runUrl}/artifacts/${warningArtifactId}`
              : `${runUrl}#artifacts`;
            const docsPreviewArtifactUrl = docsPreviewArtifactId
              ? `${runUrl}/artifacts/${docsPreviewArtifactId}`
              : `${runUrl}#artifacts`;

            const body = [
              marker,
              '## Doxygen warning report',
              '',
              `- Warning count: ${warningCount}`,
              `- Max warning count: ${maxWarningCount} (-1 means disabled)`,
              `- Warning file: \`${warningFile}\``,
              `- Docs log: \`${logPath}\``,
              `- Docs preview artifact: ${docsPreviewArtifactUrl}`,
              `- Warning report artifact: ${warningArtifactUrl}`,
              `- Run logs/artifacts: ${runUrl}`
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
