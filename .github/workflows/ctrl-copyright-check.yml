name: Ctrl Copyright Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ctrl-copyright-check:
    name: CtrlCopyrightCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check copyright and SPDX
        uses: winccoa-tools-pack/github-actions-winccoa/actions/ctrl-copyright-check@main
        with:
          source-paths: "src/Squirt tests/WinCC_OA_Test"
          expected-owner: "winccoa-tools-pack"
          expected-spdx: "MIT"
          blacklist: |
            # Third-party / generated / vendor test hooks that cannot use the
            # standard project license header.
            tests/WinCC_OA_Test/TestSuites/suite_unit/sub_unit/scripts/tests/libs/fileSys.ctl
            tests/WinCC_OA_Test/Projects/TfCustomizedSquirt/data/hsp/templates/scriptEditor/newUnitTest.ctl
            tests/WinCC_OA_Test/Projects/TfCustomizedSquirt/scripts/libs/classes/testFramework/testProject/HookTfTestProject.ctl
            tests/WinCC_OA_Test/Projects/TfCustomizedSquirt/scripts/libs/classes/testFramework/HookTfTestRunner.ctl
