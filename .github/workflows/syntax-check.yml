name: WinCC OA Syntax Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  syntax-check:
    name: Syntax check (Squirt)
    runs-on: ubuntu-latest
    env:
      WINCCOA_VERSION: 3.21
      PROJECT_PATH: src/Squirt
      WINCCOA_IMAGE: ghcr.io/winccoa-tools-pack/winccoa:v3.21.3-debian12-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Pull WinCC OA image
        run: docker pull "$WINCCOA_IMAGE"

      - name: Get source code
        uses: actions/checkout@v4

      - name: Run WinCC OA syntax check
        uses: winccoa-tools-pack/github-actions-winccoa/actions/winccoa-syntax-check@feature/add-winccoa-test-actions
        with:
          path: .
          winccoa-version: '3.21'
          languages: |
            en_US.utf8
          fail-on-error: 'true'
          mode: 'all'

      - name: Summarize syntax result
        if: always()
        shell: bash
        run: |
          {
            echo "## Syntax check result"
            echo
            echo "- Project path: ${{ env.PROJECT_PATH }}"
            echo "- Error count: ${{ steps.run-wincc-oa-syntax-check.outputs.error-count }}"
            echo "- Failure count: ${{ steps.run-wincc-oa-syntax-check.outputs.failure-count }}"
          } >> "$GITHUB_STEP_SUMMARY"
